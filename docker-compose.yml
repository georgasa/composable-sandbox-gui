# Run from the repo root: docker compose up -d --build
# Brings up both demo apps together -- this is the primary way to run this
# monorepo locally (Rancher Desktop / any Docker Compose engine). Each app
# also has its own docker-compose.yml under console-app/ for running it in
# isolation, but this file is what CI mirrors into the Azure deployment
# (see .github/workflows/deploy.yml, infra/provision.sh).
services:
  console-backend:
    build:
      context: .
      dockerfile: console-app/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DEPOSITS_BASE_URL: "http://deposits-aekxuia0951.westeurope.cloudapp.azure.com/irf-deposits-container/api/v1.0.0"
      HOLDINGS_BASE_URL: "http://aekxuia0951.westeurope.cloudapp.azure.com/ms-holdings-api/api/v1.0.0"
      PARTY_BASE_URL: "http://aekxuia0951.westeurope.cloudapp.azure.com/ms-party-api/api/v5.0.0"
      LENDING_BASE_URL: "http://lending-aekxuia0951.westeurope.cloudapp.azure.com/irf-lending-container/api/v1.0.0"
      COMPANY_ID: "GB0010001"
      SYSTEM_DATE: "2025-03-14"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      REQUEST_TIMEOUT_SECONDS: "30"
      LONG_REQUEST_TIMEOUT_SECONDS: "90"
      PENDING_EXECUTION_TTL_SECONDS: "300"
      # "none" locally (default), "password" on Azure -- see
      # console-app/backend/app/auth.py.
      AUTH_MODE: "${AUTH_MODE:-none}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    volumes:
      - ./console-app/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  console-frontend:
    build:
      context: .
      dockerfile: console-app/frontend/Dockerfile
    ports:
      - "8091:80"
    environment:
      BACKEND_HOST: console-backend
      BACKEND_PORT: "8000"
    depends_on:
      - console-backend

  mobile-backend:
    build:
      context: mobile-simulator/backend
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    environment:
      DEPOSITS_BASE_URL: "http://deposits-aekxuia0951.westeurope.cloudapp.azure.com/irf-deposits-container/api/v1.0.0"
      HOLDINGS_BASE_URL: "http://aekxuia0951.westeurope.cloudapp.azure.com/ms-holdings-api/api/v1.0.0"
      PARTY_BASE_URL: "http://aekxuia0951.westeurope.cloudapp.azure.com/ms-party-api/api/v5.0.0"
      LENDING_BASE_URL: "http://lending-aekxuia0951.westeurope.cloudapp.azure.com/irf-lending-container/api/v1.0.0"
      COMPANY_ID: "GB0010001"
      SYSTEM_DATE: "2025-03-14"
      AUTH_MODE: "${AUTH_MODE:-none}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mobile-frontend:
    build:
      context: mobile-simulator/frontend
      dockerfile: Dockerfile
    ports:
      - "8092:80"
    environment:
      BACKEND_HOST: mobile-backend
      BACKEND_PORT: "8000"
    depends_on:
      - mobile-backend
