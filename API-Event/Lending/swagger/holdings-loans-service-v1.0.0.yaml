components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKey:
      type: apiKey
      name: Authorization
      in: header

  parameters:
    page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
      description: >
        The total number of records per page.
    page_start:
      name: page_start
      in: query
      required: false
      schema:
        type: integer
      description: >
        The record from which the response should be displayed.
    page_token:
      name: page_token
      in: query
      required: false
      schema:
        type: string
      description: >
        Unique id expected to be returned as part of the response from the system.
    disablePagination:
      name: disablePagination
      in: header
      required: false
      schema:
        type: boolean
      description: >
        Defines the availability of the pagination attributes in the header. If it is set to true, the system will fetch all the data without pagination.
    validate_only:
      name: validate_only
      in: query
      required: false
      schema:
        type: boolean
      description: >
        Indicates whether the request should be validated only (true) or executed (false).
    credentials:
      name: credentials
      in: header
      required: false
      schema:
        type: string
      description: >
        Username and password to authenticate the API request in the system.
    companyReference:
      name: companyReference
      in: header
      required: false
      schema:
        type: string
      description: >
        Specifies the company code to which the external account belongs.
    deviceId:
      name: deviceId
      in: header
      required: false
      schema:
        type: string
      description: >
        Identifies the device type.
    userRole:
      name: userRole
      in: header
      required: false
      schema:
        type: string
      description: >
        User who initiated the transaction.
    channel:
      name: channel
      in: header
      required: false
      schema:
        type: string
      description: >
        Captures the origination or servicing channel through which the account or transaction was initiated, such as BRANCH or ONLINE.

  schemas:

    getCustomerRelatedLoansResponse:
      type: object
      properties:
        accounts:
          type: array

          description: >
            Contains all of the accounts related to the specified party.

          items:
            type: object
            properties:
              accountBalance:
                type: number

                description: >
                  Represents the real-time available balance of the account, showing accessible funds.

                example: 1000.0

              accountId:
                type: string

                description: >
                  Unique identifier of the account. For example - 123456.

                example: 123456

              accountName:
                type: string

                description: >
                  Defines the name of the account. For example, "MySavingsAccount" or "MyCurrentAccount".

                example: MySavingsAccount

              status:
                type: string

                description: >
                  Indicates the funding status of the account (e.g., Current, Unauthorized or Fully funded, Partially funded, Not Funded).

                example: CURRENT

              branch:
                type: string

                description: >
                  Defines the branch to which the account belongs.

                example: 01123

              channel:
                type: string

                description: >
                  Captures the origination or servicing channel through which the account or transaction was initiated, such as BRANCH or ONLINE.

                example: EMAIL

              companyCode:
                type: string

                description: >
                  Defines the company/entity to which the account is maintained.

                example: GB0010001

              contractDate:
                type: string

                description: >
                  Defines the date on which the account was created. The format of the date is yyyy-mm-dd.

                example: 2025-04-14

              currency:
                type: string

                description: >
                  Contains the 3-digit ISO currency code that indicates the currency of the account. For example - USD.

                example: USD

              lineOfBusiness:
                type: string

                description: >
                  Specifies the banking line of business (e.g., RETAIL, CORPORATE) under which the account is managed.

                example: 99

              parties:
                type: array

                description: >
                  Defines the parties of the account and their respective roles.

                items:
                  type: object
                  properties:
                    partyId:
                      type: string

                      description: >
                        The party identification number associated with the account.

                      example: 189993

                    partyRole:
                      type: string

                      description: >
                        Defines the role of the party in the account.

                      example: OWNER

              productId:
                type: string

                description: >
                  Contains the name of the product associated with the account (e.g., RegularCurrentAccount).

                example: ConsumerLoan

              productType:
                type: string

                description: >
                  Contains the broader product group under which the account's product is categorized.

                example: CurrentAccount

              startDate:
                type: string

                description: >
                  Defines the date on which the transaction, payment, or change gets initiated. The format of the date is yyyy-mm-dd.

                example: 2025-04-14

    getPartyListOfLoansResponse:
      type: object
      properties:
        accounts:
          type: array

          description: >
            Contains all of the accounts related to the specified party.

          items:
            type: object
            properties:
              accountId:
                type: string

                description: >
                  Unique identifier of the account. For example - 123456.

                example: 123456

              termAmount:
                type: number

                description: >
                  The loan amount originally set for the loan's term.

                example: 750000

              maturityDate:
                type: string

                description: >
                  Defines the maturity date of the account. It is applicable to term deposit and lending products. The format of the date is yyyy-mm-dd.

                example: 2025-04-14

              ageingStatus:
                type: string

                description: >
                  The ageing status of the loan account.

                example: CURRENT

              currency:
                type: string

                description: >
                  Contains the 3-digit ISO currency code that indicates the currency of the account. For example - USD.

                example: USD

              branch:
                type: string

                description: >
                  Defines the branch to which the account belongs.

                example: 01123

              contractDate:
                type: string

                description: >
                  Defines the date on which the account was created. The format of the date is yyyy-mm-dd.

                example: 2025-04-14

              startDate:
                type: string

