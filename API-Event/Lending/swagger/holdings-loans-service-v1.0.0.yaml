openapi: 3.0.0
info:
  title: Lending Capability - Loans
  version: 1.0.0
  description: >
    Temenos exhibits composability in its design approach by dividing the system into smaller, loosely coupled capabilities. The deposits capabilities of Retail Composable Banking is an independently deployable piece of software providing solution for specific business area namely retail deposits and retail accounts. This API can be used to create and manage accounts such as current, savings, using the Arrangement Architecture.

servers:
  - url: http://api.server.com/api/v1.0.0
  - url: https://api.server.com/api/v1.0.0

security:
  - basicAuth: []
  - apiKey: []

tags:
  - name: Loan Origination
  - name: Loan Simulation
  - name: Repayment & Disbursement
  - name: Balance Maintenance
  - name: Payment Schedule Management
  - name: Settlement Instructions
  - name: Pricing Adjustments
  - name: Term Management
  - name: Loan Maintenance
  - name: Loan Parties
  - name: Loan Balances & Info
  - name: Statements
  - name: Activity Reversals
  - name: Migrations
  - name: Loan Closure

paths:

  /holdings/activities/{activityReference}:
    delete:
      operationId: reversePostedActivity

      tags:
        - Activity Reversals

      summary: Reverse an activity.
      description: >
        Reverse the specified activity on a loan.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: activityReference
          in: path
          required: true
          schema:
            type: string
          description: >
            Contains the unique reference id of the activity that will be reversed.
          example: AAACT25105T3FKC472

      responses:
        '200':
          description: reversePostedActivity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/consumerLoans:
    post:
      operationId: createConsumerLoans

      x-event: lending.createLoan.loanCreated

      tags:
        - Loan Origination

      summary: Create consumer loans.
      description: >
        Create a consumer loan for a single customer or more than one customer (such as for a joint loan or co-borrower loan).

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createConsumerLoansRequest"

      responses:
        '200':
          description: createConsumerLoans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/linesOfCredit:
    post:
      operationId: createLOC

      x-event: lending.createLoan.loanCreated

      tags:
        - Loan Origination

      summary: Create line of credit.
      description: >
        Create a line of credit for a single customer or more than one customer (such as for a joint loan or co-borrower loan).

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createLOCRequest"

      responses:
        '200':
          description: createLOC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/migrations:
    post:
      operationId: lendingTakeover

      x-event: lending.takeover.loanCreated

      tags:
        - Migrations

      summary: Take over loan details.
      description: >
        Take over loan details from a legacy system by capturing and migrating the loan details, such as the customers, product, and currency, and migrating them.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lendingTakeoverRequest"

      responses:
        '200':
          description: lendingTakeover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/mortgages:
    post:
      operationId: createMortgages

      x-event: lending.createLoan.loanCreated

      tags:
        - Loan Origination

      summary: Create a mortgage.
      description: >
        Create a mortgage for a single customer or more than one customer (such as for a joint loan or co-borrower loan).

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMortgagesRequest"

      responses:
        '200':
          description: createMortgages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/parties:
    post:
      operationId: addCustomer

      x-event: lending.updateParty.partyUpdated

      tags:
        - Loan Parties

      summary: Add customers to loan.
      description: >
        Add customers to the specified loan account by providing customer codes and roles to be added.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addCustomerRequest"

      responses:
        '200':
          description: addCustomer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/parties/{partyId}/loans:
    get:
      operationId: getPartyListOfLoans

      tags:
        - Loan Balances & Info

      summary: Get party loan details.
      description: >
        Returns the details of all loans for a specified party, including product, currency, term, status, and repayment-related information.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
          description: >
            The party identification number associated with the account.
          example: 189993

      responses:
        '200':
          description: getPartyListOfLoans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getPartyListOfLoansResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/parties/{partyId}/relation:
    get:
      operationId: getCustomerRelatedLoans

      tags:
        - Loan Parties

      summary: Get loans related to party.
      description: >
        Returns the loans related to the specified party loan owner, along with the ownership and relation details.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
          description: >
            The party identification number associated with the account.
          example: 189993

      responses:
        '200':
          description: getCustomerRelatedLoans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getCustomerRelatedLoansResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/simulation:
    post:
      operationId: createlendingSim

      tags:
        - Loan Origination

      summary: Loan account opening simulation.
      description: >
        Perform an account opening simulation for loans.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createlendingSimRequest"

      responses:
        '200':
          description: createlendingSim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createlendingSimResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}:
    get:
      operationId: getLoanDetails

      tags:
        - Loan Balances & Info

      summary: Get loan details
      description: >
        Returns all details for a specified loan, with key details such as product, status, currency, and outstanding balance.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

        - name: companyReference
          in: header
          required: false
          schema:
            type: string
          description: >
            Specifies the company code to which the external account belongs.
          example: GB0010001

      responses:
        '200':
          description: getLoanDetails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getLoanDetailsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/activityHistory:
    get:
      operationId: getLendingActivityHistory

      tags:
        - Loan Balances & Info

      summary: Get loan activity history.
      description: >
        Returns a list of activities that have been performed for a specified loan, along with details such as the reference and status of each activity. This list includes scheduled activities, transactions, and manually triggered activities.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

        - name: companyReference
          in: header
          required: false
          schema:
            type: string
          description: >
            Specifies the company code to which the external account belongs.
          example: GB0010001

      responses:
        '200':
          description: getLendingActivityHistory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getLendingActivityHistoryResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/amortizedBills/adjustments:
    put:
      operationId: adjustAmortizedBills

      x-event: lending.adjustBalance.balanceAdjusted

      tags:
        - Balance Maintenance

      summary: Adjust amortized bills for a loan.
      description: >
        Adjust the amortization details of a specified loan that has a pending amortization.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/adjustAmortizedBillsRequest"

      responses:
        '200':
          description: adjustAmortizedBills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/balances:
    get:
      operationId: getLoanBalances

      tags:
        - Loan Balances & Info

      summary: Get details of loan balances.
      description: >
        Returns details of the outstanding loan balances for the specified loan.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getLoanBalances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getLoanBalancesResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/balances/adjustments:
    put:
      operationId: balanceAdjustment

      x-event: lending.adjustBalance.balanceAdjusted

      tags:
        - Balance Maintenance

      summary: Adjust balances for a loan.
      description: >
        Adjust the amounts from one or multiple balances for a specified loan.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/balanceAdjustmentRequest"

      responses:
        '200':
          description: balanceAdjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/balances/writeoffs:
    put:
      operationId: writeOffBalances

      x-event: lending.writeOffBalance.balanceWrittenOff

      tags:
        - Balance Maintenance

      summary: Write off balances for a loan.
      description: >
        Write off amounts from one or multiple balances for a specified loan.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/writeOffBalancesRequest"

      responses:
        '200':
          description: writeOffBalances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/balancesAndBills/adjustments:
    put:
      operationId: balanceAndBillAdjustment

      x-event: lending.adjustAllBalance.allBalanceAdjusted

      tags:
        - Balance Maintenance

      summary: Adjust both balances and bills for a loan.
      description: >
        Adjust the amounts of both balances and bills for a specified loan.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/balanceAndBillAdjustmentRequest"

      responses:
        '200':
          description: balanceAndBillAdjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/bills/adjustments:
    put:
      operationId: billAdjustment

      x-event: lending.adjustBill.billAdjusted

      tags:
        - Balance Maintenance

      summary: Adjust bills for a loan.
      description: >
        Adjust the amounts of single or multiple bills for a specified loan.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/billAdjustmentRequest"

      responses:
        '200':
          description: billAdjustment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/bills/writeoffs:
    put:
      operationId: writeOffBills

      x-event: lending.writeOffBill.billWrittenOff

      tags:
        - Balance Maintenance

      summary: Write off bills for a loan.
      description: >
        Write off amounts from one or multiple bills for a specified loan.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/writeOffBillsRequest"

      responses:
        '200':
          description: writeOffBills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/lending/{accountId}/branch:
    put:
      operationId: changeBranch

      x-event: lending.modifyBranch.branchModified

      tags:
        - Loan Maintenance

      summary: Change the branch for a loan.
      description: >
        Change the branch of an existing loan specified in the path.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyReference'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/changeBranchRequest"

      responses:
        '200':
          description: changeBranch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
