openapi: 3.0.0
info:
  title: Deposits Module - Accounts
  version: 1.0.0
  description: >
    Temenos exhibits modularity in its design approach by dividing the system into smaller, loosely coupled modules. The deposits modules of Retail Modular Banking is an independently deployable piece of software providing solution for specific business area namely retail deposits and retail accounts. This API can be used to create and manage accounts such as current, savings, using the Arrangement Architecture.

servers:
  - url: http://api.server.com/api/v1.0.0
  - url: https://api.server.com/api/v1.0.0

security:
  - basicAuth: []
  - apiKey: []

tags:
  - name: Account Closure
  - name: Account Information
  - name: Account Interests
  - name: Account Maintenance
  - name: Account Migrations
  - name: Account Opening
  - name: Account Overdrafts
  - name: Account Parties
  - name: Account Services
  - name: Account Statements
  - name: Activity Reversals
  - name: Fund Blocking
  - name: Payment Schedules
  - name: Posting Restrictions
  - name: Settlement Instructions
  - name: Simulation Execution

paths:

  /holdings/accounts/currentAccounts:
    post:
      operationId: createCurrentAccounts

      x-event: accounts.createAccount.accountCreated

      tags:
        - Account Opening

      summary: Create a current account.
      description: >
        Create a current account for a single customer or more than one customer (such as for a joint account relationship).

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createCurrentAccountsRequest"

      responses:
        '200':
          description: createCurrentAccounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createCurrentAccountsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/migrations:
    post:
      operationId: accountTakeoverAccounts

      x-event: accounts.takeover.accountCreated

      tags:
        - Account Migrations

      summary: Take over account details.
      description: >
        Take over account details from a legacy system by capturing and migrating the account details, such as the customers, product, and currency, and migrating them.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/accountTakeoverAccountsRequest"

      responses:
        '200':
          description: accountTakeoverAccounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accountTakeoverAccountsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencyAccounts:
    post:
      operationId: CreateMultiCurrencyAccount

      x-event: multiCurrencyAccounts.createAccount.accountCreated

      tags:
        - Account Opening

      summary: Create a multi-currency account.
      description: >
        Create a multi-currency account (MCA) for a single customer or more than one customer (such as for a joint account relationship), enabling multiple currency sub-accounts to be maintained under a single top-level arrangement.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMultiCurrencyAccountRequest"

      responses:
        '200':
          description: CreateMultiCurrencyAccount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMultiCurrencyAccountResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencyAccounts/simulation:
    post:
      operationId: createMcyAccountSim

      tags:
        - Account Opening

      summary: Multi-currency account opening simulation.
      description: >
        Perform a multi-currency account opening simulation to validate eligibility, pricing, and expected setup before creating the account.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMcyAccountSimRequest"

      responses:
        '200':
          description: createMcyAccountSim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMcyAccountSimResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencyAccounts/{accountId}:
    get:
      operationId: getMcyAccountDetails

      tags:
        - Account Information

      summary: Get multi-currency account details.
      description: >
        Returns the details of a specified multi-currency parent account, including the currency, product type, status, and balance information.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getMcyAccountDetails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMcyAccountDetailsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencyAccounts/{accountId}/closure:
    put:
      operationId: closeMultiCurrencyAccount

      x-event: multiCurrencyAccounts.close.accountClosed

      tags:
        - Account Closure

      summary: Close a multi-currency account.
      description: >
        Close the specified multi-currency account (top-level arrangement) once all required conditions are met, such as settling balances and completing any required sub-account closures.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/closeMultiCurrencyAccountRequest"

      responses:
        '200':
          description: closeMultiCurrencyAccount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencyAccounts/{accountId}/closure/simulation:
    post:
      operationId: simulateMcyAccountClosure

      tags:
        - Account Closure

      summary: Multi-currency account closure simulation.
      description: >
        Perform a multi-currency account closure simulation to calculate fees, interest, and any outstanding amounts that must be settled before closing the top-level account.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulateMcyAccountClosureRequest"

      responses:
        '200':
          description: simulateMcyAccountClosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulateMcyAccountClosureResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencySubAccounts:
    post:
      operationId: CreateMultiCurrencySubAccount

      x-event: accounts.createAccount.accountCreated

      tags:
        - Account Opening

      summary: Create a multi-currency sub-account.
      description: >
        Create a currency sub-account under an existing multi-currency account, allowing balances and transactions to be maintained separately per currency.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMultiCurrencySubAccountRequest"

      responses:
        '200':
          description: CreateMultiCurrencySubAccount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMultiCurrencySubAccountResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencySubAccounts/simulation:
    post:
      operationId: createMcySubAccountSim

      tags:
        - Account Opening

      summary: Multi-currency sub-account opening simulation.
      description: >
        Perform a multi-currency sub-account opening simulation to validate setup, pricing, and expected balances before creating the sub-account.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMcySubAccountSimRequest"

      responses:
        '200':
          description: createMcySubAccountSim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createMcySubAccountSimResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencySubAccounts/{accountId}:
    get:
      operationId: getMcySubAccountDetails

      tags:
        - Account Information

      summary: Get multi-currency sub-account details.
      description: >
        Returns the details of a specified multi-currency sub-account, including the currency, product type, status, and balance information.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getMcySubAccountDetails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMcySubAccountDetailsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencySubAccounts/{accountId}/closure:
    put:
      operationId: closeMultiCurrencySubAccount

      x-event: accounts.close.accountClosed

      tags:
        - Account Closure

      summary: Close multi-currency sub-accounts.
      description: >
        Close one or more currency sub-accounts under a multi-currency account once required conditions are met, such as settling balances and pending items for each sub-account.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/closeMultiCurrencySubAccountRequest"

      responses:
        '200':
          description: closeMultiCurrencySubAccount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/multiCurrencySubAccounts/{accountId}/closure/simulation:
    post:
      operationId: simulateMcySubAccountClosure

      tags:
        - Account Closure

      summary: Multi-currency sub-account closure simulation.
      description: >
        Perform a multi-currency sub-account closure simulation to calculate fees, interest, and any outstanding amounts that must be settled before closing a currency sub-account.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulateMcySubAccountClosureRequest"

      responses:
        '200':
          description: simulateMcySubAccountClosure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulateMcySubAccountClosureResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/overdraftLimits:
    post:
      operationId: createAccountsOverdraftLimits

      x-event: accounts.updateLimit.limitUpdated

      tags:
        - Account Overdrafts

      summary: Add an overdraft limit to an account.
      description: >
        Create overdraft limits for a specified account by setting an amount, expiration date, and availability.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createAccountsOverdraftLimitsRequest"

      responses:
        '200':
          description: createAccountsOverdraftLimits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/parties:
    post:
      operationId: addCustomerAccounts

      x-event: accounts.updateParty.partyUpdated

      tags:
        - Account Parties

      summary: Add customers to an existing current or savings account.
      description: >
        Add customers to the specified account by providing customer codes and roles to be added.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addCustomerAccountsRequest"

      responses:
        '200':
          description: addCustomerAccounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/savingsAccounts:
    post:
      operationId: createSavingsAccounts

      x-event: accounts.createAccount.accountCreated

      tags:
        - Account Opening

      summary: Create a savings account.
      description: >
        Create a savings account for a single customer or more than one customer (such as for a joint account relationship).

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createSavingsAccountsRequest"

      responses:
        '200':
          description: createSavingsAccounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createSavingsAccountsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/simulation:
    post:
      operationId: createAccountSim

      tags:
        - Account Opening

      summary: Account opening simulation.
      description: >
        Perform an account opening simulation for current and savings accounts.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createAccountSimRequest"

      responses:
        '200':
          description: createAccountSim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createAccountSimResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/{accountId}:
    get:
      operationId: getAccountDetails

      tags:
        - Account Information

      summary: Get account details.
      description: >
        Returns the details of a specified account, including the currency, product type, and status, amongst other information.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getAccountDetails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccountDetailsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/{accountId}/activityHistory:
    get:
      operationId: getAccountActivityHistory

      tags:
        - Account Information

      summary: Get the history of activities on a current or savings account.
      description: >
        Returns a list of the activities that have been performed for a specified account, along with details such as the reference and status of each activity. This list includes scheduled activities, transactions, manually triggered activities, etc.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getAccountActivityHistory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccountActivityHistoryResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/accounts/{accountId}/balances:
    get:
      operationId: getAccountBalance

      tags:
        - Account Information

      summary: Get account balances.
      description: >
        Returns balance details for a specified account, including information such as currency, ledger balance, and blocked amount.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getAccountBalance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAccountBalanceResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

