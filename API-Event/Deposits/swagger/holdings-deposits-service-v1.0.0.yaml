    createDepositsSettlementInstructionsRequest:
      type: object
      x-conditional: >
        Either 'payinAccountId' or 'payinBeneficiaryId' is required. Both cannot be present at the same time.
        Either 'payoutAccountId' or 'payoutBeneficiaryId' is required. Both cannot be present at the same time.
        If 'enablePayinSettlement' is set to 'true' and 'payinBeneficiaryId' is present in the payload, then 'payinPoProduct' is required.
        If 'enablePayoutSettlement' is set to 'true' and 'payoutBeneficiaryId' is present in the payload, then 'payoutPoProduct' is required.
        The fields 'payinPercentage' and 'maximumPayinAmount' are mutually exclusive. Neither are required and both cannot be present at the same time.
        The fields 'payoutPercentage' and 'maximumPayoutAmount' are mutually exclusive. Neither are required and both cannot be present at the same time.
        If 'enablePayinSettlement' is set to 'true', then the fields 'payinPaymentType' and 'payinSettlementType' are both required.
        If 'enablePayoutSettlement' is set to 'true', then either 'payoutProperty' or 'payoutPropertyClass' is required. Both cannot be present.
      properties:
        payinInstructions:
          type: array
          items:
            type: object
            properties:
              payinPaymentType:
                type: string

                description: >
                  Defines the payment type to which the settlement configuration applies (e.g., for current/savings accounts - Interest, Charge, or Payoff; for deposits - Funding or Charge).

                x-reference:  /reference?applicationId=AA.PAYMENT.TYPE

                example: CHARGE

              payinSettlementType:
                type: string

                description: >
                  Defines how the settlement will be handled in case of insufficient funds (e.g., Full, Partial, or None).

                example: Full

              enablePayinSettlement:
                type: boolean

                description: >
                  Defines if the settlement instructions that are configured for receiving amounts are active (true) or not (false).

                example: False

              payinAccountId:
                type: string

                description: >
                  Specifies the account number to be debited for the billed amount.

                example: 1013724489

              payinBeneficiaryId:
                type: string

                description: >
                  Specifies the beneficiary to be debited for the billed amount.

                example: BEN2509020900

              payinPoProduct:
                type: string

                description: >
                  Defines the payment order product that will be used to perform the payment.

                example: ACCOUNT

              payinPercentage:
                type: number

                description: >
                  Defines the percentage of the bill amount debited to this settlement account. Total percentages for a payment type must not exceed 100%. The last entry should be left blank to represent the remainder. Settlement is processed top-down.

                example: 4.0

              maximumPayinAmount:
                type: number

                description: >
                  Defines the maximum bill amount that can be debited to this settlement account. Settlement is processed top-down; totals are not validated against the bill amount.

                example: 1000.0

              payinActivity:
                type: string

                description: >
                  Defines the activity code used to settle the amount for the respective payment type(s).

                example: LENDING-APPLYPAYMENT-RepaymentRules

              debitActivity:
                type: string

                description: >
                  Defines the activity code used to debit the settlement account for the appropriate bill amount.

                example: ACCOUNTS-DEBIT-ARRANGEMENT

        payoutInstructions:
          type: array
          items:
            type: object
            properties:
              enablePayoutSettlement:
                type: boolean

                description: >
                  Defines if the settlement instructions that are configured for paying out amounts are active (true) or not (false).

                example: False

              payoutAccountId:
                type: string

                description: >
                  Specifies the account number to be credited with the billed amount.

                example: 1013724489

              payoutBeneficiaryId:
                type: string

                description: >
                  Specifies the beneficiary to be credited with the billed amount.

                example: BEN2509020900

              payoutPoProduct:
                type: string

                description: >
                  Defines the payment order product that will be used to perform the payment.

                example: ACCOUNT

              payoutPercentage:
                type: number

                description: >
                  Defines the percentage of the bill amount credited to this settlement account. Total percentages for a payment type must not exceed 100%. The last entry should be left blank to represent the remainder. Settlement is processed top-down.

                example: 4.0

              maximumPayoutAmount:
                type: number

                description: >
                  Defines the maximum bill amount that can be credited to this settlement account. Settlement is processed top-down; totals are not validated against the bill amount.

                example: 1000.0

              payoutActivity:
                type: string

                description: >
                  Defines the activity code used to settle the amount for the respective payment type(s).

                example: LENDING-APPLYPAYMENT-WithdrawalRules

              creditActivity:
                type: string

                description: >
                  Defines the activity code used to credit the settlement account for the appropriate bill amount.

                example: ACCOUNTS-CREDIT-ARRANGEMENT

              payoutProperty:
                type: string

                description: >
                  Defines the property which will be used to credit the respective settlement Account.

                example: ACCHARGE

              payoutPropertyClass:
                type: string

                description: >
                  Defines the property class which will be used to credit the respective settlement Account.

                example: ACCOUNT

        effectiveDate:
          type: string

          description: >
            Defines the date on which the change goes into effect. Defaults to the current banking date if omitted. The format of the date is yyyy-mm-dd.

          example: 2025-04-14

        narrative:
          type: string

          description: >
            Contains an explanation of the changes that were made.

          example: Lending account simulation

        externalDetails:
          type: object

          description: >
            An object containing the company reference and system reference that are used to define and identify an external account id.

          items:
            type: object
            properties:
              companyReference:
                type: string

                description: >
                  Defines the company code to which the external account belongs.

                example: GB0010001

              systemReference:
                type: string

                description: >
                  Defines the system to which the external account belongs.

