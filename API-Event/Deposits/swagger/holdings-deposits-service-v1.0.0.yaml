openapi: 3.0.0
info:
  title: Deposits Module - Deposits
  version: 1.0.0
  description: >
    Temenos exhibits modularity in its design approach by dividing the system into smaller, loosely coupled modules. The deposits modules of Retail Modular Banking is an independently deployable piece of software providing solution for specific business area namely retail deposits and retail accounts. This API can be used to create and manage accounts such as current, savings, using the Arrangement Architecture.

servers:
  - url: http://api.server.com/api/v1.0.0
  - url: https://api.server.com/api/v1.0.0

security:
  - basicAuth: []
  - apiKey: []

tags:
  - name: Account Maintenance
  - name: Activity Reversals
  - name: Deposit Information
  - name: Deposit Interest
  - name: Deposit Maintenance
  - name: Deposit Migration
  - name: Deposit Opening
  - name: Deposit Parties
  - name: Deposit Rollovers
  - name: Deposit Services
  - name: Deposit Statements
  - name: Early Withdrawals
  - name: Fund Blocking
  - name: Payment Schedules
  - name: Posting Restrictions
  - name: Pricing Adjustments
  - name: Settlement Instructions

paths:

  /holdings/activities/{activityReference}:
    delete:
      operationId: reversePostedActivity

      tags:
        - Activity Reversals

      summary: Reverse an activity.
      description: >
        Reverse the specified activity on an account.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: activityReference
          in: path
          required: true
          schema:
            type: string
          description: >
            Contains the unique reference id of the activity that will be reversed.
          example: AAACT25105T3FKC472

      responses:
        '200':
          description: reversePostedActivity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/migrations:
    post:
      operationId: accountTakeoverDeposits

      x-event: deposits.takeover.depositCreated

      tags:
        - Deposit Migration

      summary: Take over account details.
      description: >
        Take over account details from a legacy system by capturing and migrating the account details, such as the customers, product, and currency, and migrating them.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/accountTakeoverDepositsRequest"

      responses:
        '200':
          description: accountTakeoverDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accountTakeoverDepositsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/parties:
    post:
      operationId: addCustomerDeposits

      x-event: deposits.updateParty.partyUpdated

      tags:
        - Deposit Parties

      summary: Add customers to an existing Term Deposit account.
      description: >
        Add customers to the specified term deposit account by providing customer codes and roles to be added.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addCustomerDepositsRequest"

      responses:
        '200':
          description: addCustomerDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/rollover:
    post:
      operationId: createManualRollover

      x-event: deposits.updateCondition.conditionUpdated

      tags:
        - Deposit Rollovers

      summary: Perform a manual rollover of a term deposit account.
      description: >
        Change and execute a rollover for a term deposit account. The rollover can be set to automatic or manual, and the product and term amount can also be modified.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createManualRolloverRequest"

      responses:
        '200':
          description: createManualRollover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/termDeposits:
    post:
      operationId: createTermDeposits

      x-event: deposits.createDeposit.depositCreated

      tags:
        - Deposit Opening

      summary: Create a term deposit.
      description: >
        Create a term deposit for a single customer or more than one customer (such as for a joint deposit). The deposit information, including term and deposit amount, can be input by the user at the time of deposit opening.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createTermDepositsRequest"

      responses:
        '200':
          description: createTermDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createTermDepositsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/termDeposits/simulation:
    post:
      operationId: createTermDepositsSimulation

      tags:
        - Deposit Opening

      summary: New term deposit simulation.
      description: >
        Perform a term deposit opening simulation.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createTermDepositsSimulationRequest"

      responses:
        '200':
          description: createTermDepositsSimulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createTermDepositsSimulationResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}:
    get:
      operationId: getTermDeposits

      tags:
        - Deposit Information

      summary: Get the details of a term deposit account.
      description: >
        Returns a list of term deposit accounts with details such as currency, parties, balance, and maturity date.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getTermDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getTermDepositsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/activityHistory:
    get:
      operationId: getDepositActivityHistory

      tags:
        - Deposit Information

      summary: Get deposit activity history
      description: >
        Returns the activity (transactions) history for the specified deposit account.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getDepositActivityHistory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getDepositActivityHistoryResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/balances:
    get:
      operationId: getTermDepositsInfo

      tags:
        - Deposit Information

      summary: Get the balances of a term deposit.
      description: >
        Returns balance details for a specified term deposit, including information such as currency, balance, and accrued interest.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getTermDepositsInfo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getTermDepositsInfoResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/blockedFunds:
    get:
      operationId: getDepositsBlockFunds

      tags:
        - Fund Blocking

      summary: Get the blocked funds details for a term deposit account.
      description: >
        Returns a list of active (and optionally expired) fund blocks with details such as the amount blocked, start date, and blocking reference.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getDepositsBlockFunds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getDepositsBlockFundsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/dormancyStatus:
    put:
      operationId: changeDepositDormancyStatus

      x-event: deposits.changeDormancy.dormancyChanged

      tags:
        - Account Maintenance

      summary: Change the dormancy status of a term deposit account.
      description: >
        Change the dormancy status of the specified term deposit account to ensure correct operational status.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/changeDepositDormancyStatusRequest"

      responses:
        '200':
          description: changeDepositDormancyStatus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/earlyWithdrawals:
    post:
      operationId: createEarlyWithdrawals

      x-event: deposits.payout.transactionExecuted

      tags:
        - Early Withdrawals

      summary: Early withdrawal from a term deposit account.
      description: >
        Create and perform early withdrawals on a term deposit account. Withdrawals can be either full or partial.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createEarlyWithdrawalsRequest"

      responses:
        '200':
          description: createEarlyWithdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/earlyWithdrawals/simulation:
    post:
      operationId: simulateEarlyWithdrawals

      tags:
        - Early Withdrawals

      summary: Simulation of early withdrawal from a term deposit account.
      description: >
        Simulate early withdrawals on a term deposit account in order to see the impact on fees, benefits, and interest before performing the actual withdrawal.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/simulateEarlyWithdrawalsRequest"

      responses:
        '200':
          description: simulateEarlyWithdrawals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/simulateEarlyWithdrawalsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/interestAccruals:
    get:
      operationId: getInterestDetailsDeposits

      tags:
        - Deposit Interest

      summary: Get the interest accruals of a term deposit account.
      description: >
        Returns interest accrual details for the current period of the specified term deposit account. The response includes the accrual period, currency, and an array of interest accrual information for different interest types.

      parameters:
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/page_start'
        - $ref: '#/components/parameters/page_token'
        - $ref: '#/components/parameters/disablePagination'
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      responses:
        '200':
          description: getInterestDetailsDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInterestDetailsDepositsResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/migrations/balances:
    put:
      operationId: MigrateAccountBalancesDeposits

      x-event: deposits.debitInactiveDeposit.balanceTransferred

      tags:
        - Deposit Migration

      summary: Migrate term deposit account balances.
      description: >
        Migrate term deposit account balances from a legacy system by capturing the balance details of the specified account (such as balance type, due amount, etc.).

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateAccountBalancesDepositsRequest"

      responses:
        '200':
          description: MigrateAccountBalancesDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/parties:
    put:
      operationId: changeCustomerDeposits

      x-event: deposits.updateParty.partyUpdated

      tags:
        - Deposit Parties

      summary: Change the customer(s) of a term deposit account.
      description: >
        Change the customers associated with the specified term deposit account by providing customer codes and roles.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/changeCustomerDepositsRequest"

      responses:
        '200':
          description: changeCustomerDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

    delete:
      operationId: deleteCustomerDeposits

      x-event: deposits.updateParty.partyUpdated

      tags:
        - Deposit Parties

      summary: Delete customer(s) from a term deposit account.
      description: >
        Delete particular customers from the specified term deposit account by providing customer codes and roles to be removed.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deleteCustomerDepositsRequest"

      responses:
        '200':
          description: deleteCustomerDeposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/paymentSchedule:
    put:
      operationId: changeDepositPaymentSchedule

      x-event: deposits.updateSchedule.scheduleUpdated

      tags:
        - Payment Schedules

      summary: Change the payment schedule of a term deposit account.
      description: >
        Change the payment schedule for a specified term deposit account by modifying the payment type, property, payment frequency, and/or start date.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/deviceId'
        - $ref: '#/components/parameters/userRole'
        - $ref: '#/components/parameters/channel'
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: >
            Unique identifier of the account. For example - 123456.
          example: 123456

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/changeDepositPaymentScheduleRequest"

      responses:
        '200':
          description: changeDepositPaymentSchedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrangementResponse"

        '400':
          $ref: '#/components/responses/BusinessErrorResponse'
        '500':
          $ref: '#/components/responses/SystemErrorResponse'
        'default':
          $ref: '#/components/responses/DefaultErrorResponse'

  /holdings/deposits/{accountId}/pricingAdjustments:
    put:
      operationId: createSimplePricingAdjustments

      x-event: deposits.updatePricingAdjustments.pricingAdjustmentsUpdated

      tags:
        - Pricing Adjustments

      summary: Apply fee or interest rate adjustments to a term deposit account.
      description: >
        Adjust the pricing details for a term deposit account, including any fees, interest, or additional benefits.

      parameters:
        - $ref: '#/components/parameters/validate_only'
        - $ref: '#/components/parameters/credentials'
        - $ref: '#/components/parameters/companyId'
