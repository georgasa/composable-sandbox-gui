components:
  schemas:

# Country code schema structure 
    CountrySubDivision:
      type: object
      properties:
        code:
          type: string
          description: The code for the country subdivision
          minLength: 1
          maxLength: 35
          example: "FL"
        description:
          type: string
          description: The name of the country subdivision
          minLength: 1
          maxLength: 140
          example: "Florida"        
    CountryCodes:
      type: object
      properties:
        description:
          type: string
          description: The name of the country
          minLength: 1
          maxLength: 140
          example: "United States of America"
        countrySubdivisions:
          type: array
          items:
            $ref: '#/components/schemas/CountrySubDivision'
          description: List of country subdivisions codes
        iddPrefixPhone:
          type: string
          description: The international direct dialing (IDD) prefix code
          example: "+1"
          x-referencetype: b-iddPrefixCodes"
          x-link: GET  /party/reference/referenceTypes/{referenceTypeId}
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the CountryCodes details by the regional or local implementations
          additionalProperties: true 
      required:
        - description
    CountryCodesList:
      type: object
      properties:              
        countryCodes:
          $ref: '#/components/schemas/CountryCodes'
      required:
      - countryCodes
    CountryCodesAll:
      type: object
      properties:
        countryCode:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 country code 
          
      allOf:
        - $ref: '#/components/schemas/CountryCodes' 
    CountryCodesAllList:
      type: object
      properties:
        countryCodes:        
          $ref: '#/components/schemas/CountryCodesAllItems'  
    CountryCodesAllItems:
      type: array
      items:
        $ref: '#/components/schemas/CountryCodesAll'   
# Currency Codes schema structure        
    CurrencyCodes:
      type: object
      properties:
        description:
          type: string
          description: The description of the currency
          minLength: 1
          maxLength: 140
          example: "US Dollars"
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the CurrencyCodes details by the regional or local implementations.
          additionalProperties: true   
      required:
        - description          
    CurrencyCodesList:
      type: object
      properties:              
        currencyCodes:
          $ref: '#/components/schemas/CurrencyCodes'
      required:
      - currencyCodes
    CurrencyCodesAll:
      type: object
      properties:
        currencyCode:
          type: string
          description: An ISO 4217 three alpha currency code
          example: "US"
          minLength: 3
          maxLength: 3         
          
      allOf:
        - $ref: '#/components/schemas/CurrencyCodes'  
    CurrencyCodesAllItems:
      type: array
      items:
        $ref: '#/components/schemas/CurrencyCodesAll'          
    CurrencyCodesAllList:  
      type: object
      properties:              
        currencyCodes:
          $ref: '#/components/schemas/CurrencyCodesAllItems'             
# Vulnerability Types schema structure          
    VulnerabilityTypes:
      type: object
      properties:
        description:
          type: string
          maxLength: 140
          example : "Indicates the Poor or Non Existent Digital Skills of the party "
        nature:
          type: string
          description: The nature of the vulnerability 
          example: "Capability"
          x-referencetype: vulnerabilityNature 
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
          minLength: 1
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the VulnerabilityTypes details by the regional or local implementations
          additionalProperties: true            
      required: 
        - type
        - nature
    VulnerabilityTypesList:  
      type: object
      properties:              
        vulnerabilityTypes:
          $ref: '#/components/schemas/VulnerabilityTypes'  
      required: 
      - vulnerabilityTypes
    VulnerabilityTypeAll:
      type: object
      properties:
        type:
          type: string
          description: A vulnerability type
          example: "PoorOrNonExistentDigitalSkills"      
          
      allOf:
        - $ref: '#/components/schemas/VulnerabilityTypes'    
    VulnerabilityTypeAllItems:
      type: array
      items:
        $ref: '#/components/schemas/VulnerabilityTypeAll'      
    VulnerabilityTypeAllList:   
      type: object
      properties:              
        vulnerabilityTypes:
          $ref: '#/components/schemas/VulnerabilityTypeAllItems'    
# Organisation Units schema structure          
    OrganisationUnits:        
      type: object
      properties:
        type:
          type: string
          description:  The type of the organisation unit
          example: "Branch"
          x-referencetype: organisationUnitType 
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
          minLength: 1
        name:
          type: string
          description: The name of the organisation unit
          minLength: 1
          maxLength: 140
          example: "London Branch 123"  
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the OrganisationUnits details by the regional or local implementations
          additionalProperties: true             
      required: 
        - type
        - name
    OrganisationUnitsList:
      type: object
      properties:              
        organisationUnits:
          $ref: '#/components/schemas/OrganisationUnits'              
      required: 
      - organisationUnits
    OrganisationUnitsAll:        
      type: object
      properties:
        organisationUnitCode:
