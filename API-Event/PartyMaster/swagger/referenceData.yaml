openapi: 3.0.0
info:
  title: Party Management APIs – Reference Data
  description: Temenos Party Microservice provides a party register for financial entities and encompasses an extensive set of RESTful APIs that streamline the administration of the party data.Structured into four distinct Open API Specification documents, this specification handles the party specific reference data such as party classification codes, assessments types, relationship types as well as common reference data such as languages codes, country codes, currency codes, etc.

  contact:
    url: https://basecamp.temenos.com/s/topic/0TO2K0000005Pz4WAE/microservices
  
  version: 1.0.0
servers:
  - description: Example of valid server URL
    url: http://localhost:8000/ms-party-api/api/v1.0.0
    
security:
   - bearerAuth: []
tags:

- name: Country Codes
  description: A set of ISO 3166-1 alpha-2 codes and their descriptions
- name: Currency Codes
  description: A set of ISO 4217  three-letter ("Alpha-3") currency codes and their descriptions
- name: Language Codes
  description: A set of ISO 639-1 two-letter language codes followed by '-' and ISO country code
- name: Phone IDD Prefixes
  description: A set of international prefix needed when dialing to a different country
- name: Organisation Units
  description: A set of organisation units within the financial entity organisation
- name: Vulnerability Types
  description: A set of vulnerbailities types that can be assigned to parties along with their nature/category  
- name: Party Relationship Types
  description: A set of relationships types that describe the nature of the relationship between two parties (e.g. Spouse, Subsidiary, etc), the corresponding reverse relationship and an indicator to specify if the relationship is hierarchical or flat
- name: Party Classification Codes
  description: A set of classification schemes along with the allowed codes that will be used to classify/describe the party.
  
