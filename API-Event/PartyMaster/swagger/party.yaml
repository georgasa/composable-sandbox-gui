        extensionData:
          type: object
          example:
            customField: value
          description: Specifies the additional attributes, which can be used to extend
            the employment details by the regional or local implementations. These
            details are maintained at each employment level.
          additionalProperties: true
        employerDetails:
          $ref: '#/components/schemas/EmployerDetails'
      required:
      - type
    EmploymentsForUpdate:
      description: 'Details related to one or multiple employments of the party.For
        each employment it can capture the employment type,  the employer name, segment
        or industry, postal address and contact details  alongs with the salary details,
        the start and end date. The past employment details are not automatically
        removed. It is optional for Individual party '
      type: object
      properties:
        type:
          type: string
          example: FullyEmployed
          description: Identifies the type of employment - Employed, PartialEmployed,Unemployed,Retired.
          x-referencetype: employmentType
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
        jobTitle:
          type: string
          description: The job title
          example: TV Presenter
          x-referencetype: jobTitle
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
        startDate:
          type: string
          format: date
          description: The start date of the employment
          example: '2021-01-01'
        endDate:
          type: string
          format: date
          example: '2027-01-01'
          description: The end date of the employment.Cannot be earlier than startDate
        salaryAmount:
          type: integer
          description: The salary amount associated with the employment
          example: '255000'
          maximum: 2000000000
        salaryCurrency:
          type: string
          example: GBP
          description: The currency of the salary.If the salary amount is specified
            then salary currency is mandatory.
          x-referencetype: b-currencyCodes
          x-link: GET  /party/reference/referenceTypes/{referenceTypeId}
          maxLength: 3
        salaryFrequency:
          type: string
          example: Yearly
          description: The salary frequency.
          maxLength: 35
        countryOfEmployment:
          type: string
          description: The country where the party is employed.
          example: GB
          x-referencetype: b-countryCodes
          x-link: GET  /party/reference/referenceTypes/{referenceTypeId}
          maxLength: 2
        employmentIndustry:
          type: string
          example: Broadcasting
          description: The employment segment /industry of the party.
          x-referencetype: employmentIndustry
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
        primary:
          type: boolean
          description: Identifies the primary employment of a party.
          example: true
        additionalInformation:
          type: string
          description: Additional info related to employment
          example: Additional info related to employment
          maxLength: 250
        extensionData:
          type: object
          example:
            customField: value
          description: Specifies the additional attributes, which can be used to extend
            the employment details by the regional or local implementations. These
            details are maintained at each employment level.
          additionalProperties: true
        employerDetails:
          $ref: '#/components/schemas/EmployerDetailsForUpdate'
    ClassificationsWithId:
      description: A set of classifications/characteristics assigned to the party,
        for e.g., a classification from industry point of view, from profiling/target
        point of view, bank own defined classifications/characteristics etc. For each
        classification, one or multiple classification codes can be supplied.
      type: object
      allOf:
      - $ref: '#/components/schemas/UniqueIds'
      - $ref: '#/components/schemas/Classifications'
    ResidencesWithId:
      description: The countries where the party lives/spends a significant time or where an organisation is registered, operates its activities or conduct their businesses. It includes also the details related to the residence status of the party in the respective country. It is mandatory to define at least one residence country for the party.
      type: object
      allOf:
      - $ref: '#/components/schemas/UniqueIds'
      - $ref: '#/components/schemas/Residences'      

    EmailAddressIdForUpdate:
      description: The social networks used by the party and the related social network
        ids
      type: object
      properties:
        type:
          type: string
          example: Work
          description: The type of the email address - e.g. Personal, Office, Accountant.
          x-referencetype: emailAddressType
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
        inAttentionTo:
          description: The person in attention to whom the correspondence is sent to, if other than the party itself.
