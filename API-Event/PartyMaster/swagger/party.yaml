components:
  schemas:
    UniqueIds:
      type: object
      description: The unique identifier for the respective items in the collection/object.
        This unique identifier must be used for updating the respective item in the
        collection/Object.
      properties:
        uniqueId:
          type: string
          description: The unique identifier for the respective items in the collection/object.This
            unique identifier must be used for updating the respective item in the
            collection/Object.
          example: 123456
    generalInfoforDecesedDetails:
      description: Specifies the details related to the death of a customer.
      type: object
      properties:
        lifeCycleStatus:
          type: string
          description: Describes the LifeCycle of the Party
          example: 'Bankruptcy'
          x-referencetype: lifeCycleStatus
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
        extensionData:
          type: object
          example:
            customField: value
          description: Specifies the additional attributes, which can be used to extend
            the party details by the regional or local implementations
    LegalEntityIds:
      type: object
      description: The unique identifier for the respective items in the collection/object.
        This unique identifier must be used for updating the respective item in the
        collection/Object.
      properties:
        legalEntityId:
          type: string
          example: GB0010001
          description: The code of the financial enitity which owns the party. Mandatory,
            defaulted based on the header information received in the Create API's.
          x-referencetype: legalEntityId
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
          minLength: 1
          maxLength: 11
      required:
      - legalEntityId
    AssessmentRequest:
      type: object
      properties:
        contactDetails:
          $ref: '#/components/schemas/ContactRequestDetails'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
      required:
      - assessments
    UpdateAssessmentRequest:
      type: object
      properties:
        contactDetails:
          $ref: '#/components/schemas/ContactRequestDetails'
        assessments:
          $ref: '#/components/schemas/AssessmentForUpdate'
      required:
      - assessments
    AssessmentsResponse:
      type: object
      properties:
        generalInfo:
          $ref: '#/components/schemas/GeneralInfoWithId'
        contactDetails:
          $ref: '#/components/schemas/ContactRequestDetails'
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentWithId'
        alternateIds:
          description: A list of alternate identifiers and their names. The alternate
            identifiers can be supplied instead of the party id in order to retrieve
            the party and its details.  Depending on the deployment option, the alternate
            name/type must be provided along the party/alternate Id or not.  It is
            Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/AlternateIds'
        externalReferences:
          description: A list of external identifiers that can be maintained for the
            party and can be retrieved along other details. The external identifiers
            cannot be supplied instead of the party id. It is Optional for both the
            Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/ExternalReferences'
        partyRoles:
          description: The roles of the party in relation with the financial entity.
            Currently only the customer role is supported. It is mandatory for both
            the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/RoleWithId'
    UpdateLegalIdentifiersRequest:
      type: object
      properties:
        contactDetails:
          $ref: '#/components/schemas/ContactRequestDetails'
        legalIdentifiers:
          description: A list of legal documents and/or identifiers of the party which
            include the identifier number, the issue date, issue authority, expiry
            date, etc. It is Optional for both the Individual and Organisation Parties.
          $ref: '#/components/schemas/LegalIdentifierForUpdate'
      required:
      - legalIdentifiers
    UpdateCorrespondenceAddressesRequest:
      properties:
        contactDetails:
          $ref: '#/components/schemas/ContactRequestDetails'
        correspondenceAddresses:
          $ref: '#/components/schemas/CorrespondenceAddressesForUpdates'
      required:
      - correspondenceAddresses
