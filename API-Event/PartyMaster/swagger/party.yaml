            date, etc. It is Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/LegalIdentifier'
        alternateIds:
          description: A list of alternate identifiers and their names. The alternate
            identifiers can be supplied instead of the party id in order to retrieve
            the party and its details.  Depending on the deployment option, the alternate
            name/type must be provided along the party/alternate Id or not. It is
            Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/AlternateIds'
        externalReferences:
          description: A list of external identifiers that can be maintained for the
            party and can be retrieved along other details. The external identifiers
            cannot be supplied instead of the party id. It is Optional for both the
            Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/ExternalReferences'
        domicileAddress:
          description: The permanent address of the party.
          $ref: '#/components/schemas/DomicileAddress'
        previousDomicileAddress:
          description: A list of the previous Domicile address of the party  - can
            be captured at the time when the party is created - maintained by the
            system when the Domicile address is changed through the regular update
            APIs - can be maintained/corrected after the party has been created Will
            not be updated when the Domicile address  is updated through the amendment
            API which is available for corrections - It is Optional for both the Individual
            and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/PreviousDomicileAddress'
        correspondenceAddresses:
          description: Additional  addresses of the party which can be used for correspondence.
            It is Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/CorrespondenceAddresses'
        socialNetworks:
          description: The social networks used by the party and the related social
            network ids. It is Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/SocialNetworkId'
        emailAddresses:
          description: The email addresses of the party which can be used for correspondence.
            It is Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        phoneAndTextContacts:
          description: The phone number which can be used for communication to customer.
            It is Optional for both the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/PhoneContact'
        organisationContacts:
          description: A list of persons/companies which can be contacted by the bank
            in order to manage their relationship with the organisation party. It
            is Optional Organisation Parties. Automatically removes the primary flag
            from an existing contact if a new contact is marked as primary.
          type: array
          items:
            $ref: '#/components/schemas/OrganisationContacts'
        partyRoles:
          description: The Roles of the party in relation with the financial entity.
            Currently only the customer Role is supported. It is mandatory for both
            the Individual and Organisation Parties.
          type: array
          items:
            $ref: '#/components/schemas/Role'
