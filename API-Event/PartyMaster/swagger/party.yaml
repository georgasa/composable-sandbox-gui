        taxDetails:
          description: "The list of the tax identifiers captured for the party along\
            \ with the country which has issued the identifier, the start date and\
            \ end date, the date when they have been verified. A reason can be captured\
            \ when the party doesn't have a tax identifier in a particular country.\
            \ It is Optional for both the Individual and Organisation Parties."
          type: array
          items:
            $ref: '#/components/schemas/TaxDetail'
        legalIdentifiers:
          description: A list of legal documents and/or identifiers of the party which
