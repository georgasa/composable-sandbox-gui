openapi: 3.0.0
info:
  title: Party Management APIs - Parties - Applicable for Individuals and Organisations
  description: Temenos Party Management provides an extensive set of RESTful APIs
    meticulously crafted for the streamlined administration of party data within the
    Temenos Party Microservice. The encompassed party data includes a rich array of
    information, ranging from basic demographics and employments to organization details,
    vulnerabilities, party-to-party relationships, addresses, contact details and
    more.Structured into four distinct Open API Specification documents, this specification
    comprehensively addresses a range of endpoints that serve common party data requirements
    for both individuals and organizations, covering various operations related to
    addresses, contacts, relationships, identifiers, assessments, observations, vulnerabilities,
    and more
  contact:
    url: https://basecamp.temenos.com/s/topic/0TO2K0000005Pz4WAE/microservices
  version: 1.0.0
servers:
- description: Example of valid server URL
  url: http://localhost:8000/ms-partyv2-api/api/v1.0.0
security:
- bearerAuth: []
tags:
- name: Addresses
  description: A set of API to create, maintain and retrieve the correspondence addresses
    of a party
paths:
  /reference/relationshipTypes/{relationshipType}:
    get:
      description: Retrieves relationship type reference data from Party MS
      summary: Retrieves relationship type reference data from Party MS
      tags:
        - Mdal API
      operationId: getRelationshipTypes
      parameters: 
        - name: relationshipType
          in: path
          description: Unique Identifier of relationship type
          required: true
          schema:
            type: string
            example: "GroupCompanyOf"
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipTypeResponse"
        default:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardErrorResponse"
  /party/parties/{partyId}/relatedParties:
    get:
      description: "Retrieves related parties for a party"
      summary: "Retrieves related party details for the provided party ID"
      operationId: getRelatedParties
      tags: 
        - Mdal API
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party. Must be unique within the
          microservice.
        required: true
        x-altkey: true
        schema:
          type: string
          example: GB0010001-100100
      responses:
        '200':
