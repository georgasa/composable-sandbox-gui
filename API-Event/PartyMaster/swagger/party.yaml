      required:
      - correspondenceAddresses
    LegalIdentifiersResponse:
      type: object
      properties:
        generalInfo:
          $ref: '#/components/schemas/GeneralInfoWithId'
        contactDetails:
          $ref: '#/components/schemas/ContactRequestDetails'
        legalIdentifiers:
          description: A list of legal documents and/or identifiers of the party which
            include the identifier number, the issue date, issue authority, expiry
            date, etc. It is Optional for both the Individual and Organisation Parties.
