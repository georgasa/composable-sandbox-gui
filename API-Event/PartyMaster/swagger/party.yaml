    get:
      summary: Retrieves all previous domicile addresses of the party,  or the previous
        domicile address applicable at a certain date, or applicable in a certain
        period. The asOnDate query parameter cannot be combined with the fromDate/toDate
        query parameters
      operationId: getPreviousDomicileAddresses
      tags:
      - Addresses
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party.
        required: true
        x-altkey: true
        schema:
          type: string
          example: GB0010001-100100
      - name: asOnDate
        in: query
        description: This is the date until when the respective address was applicable
          to the party. The new domicileaddress is applicable from next day
        required: false
        schema:
          type: string
          format: date
          example: '2023-02-10'
      - name: fromDate
        in: query
        description: The start date of the interval for  which the party previous
          domicile address must be retrieved
        required: false
        schema:
          type: string
          format: date
          example: '2023-02-10'
      - name: toDate
        in: query
        description: The end date of the interval for  which the party previous domicile address
          must be retrieved
        required: false
        schema:
          type: string
          format: date
          example: '2023-02-10'
      - name: uniqueId
        in: query
        description: The unique identifier of the address. It can be automatically
          allocated by the system. Must be unique within the microservice.
        required: false
        schema:
          type: string
          example: 123456
      responses:
        '200':
          description: party names updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPreviousDomicileAddressesResponse'
        '400':
          description: Bad Request
