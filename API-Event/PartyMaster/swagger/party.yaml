    get:
      summary: Fetches all the correpondence addresses of a customer or a specific
        addresses based on the unique address or an address type
      operationId: getCorrespondenceAddresses
      tags:
      - Addresses
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party. It can be automatically allocated
          by the system or imposed by an external system through ingestion. Must be
          unique within the microservice.
        required: true
        x-altkey: true
        schema:
          type: string
          example: GB0010001-100100
      - name: uniqueId
        in: query
        description: The unique identifier of the address. It can be automatically
          allocated by the system. Must be unique within the microservice.
        required: false
        schema:
          type: string
          example: 123456
      - name: addressType
        in: query
        description: The address Type of the party.
        required: false
        schema:
          type: string
          example: Home
      - name: includeGeneralInfo
        in: query
        description: Indicates whether generalInfo should be included in the response
        required: false
        schema:
          type: string
          example: Yes
      responses:
