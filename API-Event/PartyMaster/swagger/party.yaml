    ResidencesForUpdates:
      description: The countries where the party lives/spends a significant time or where an organisation is registered, operates its activities or conduct their businesses. It includes also the details related to the residence status of the party in the respective country. It is mandatory to define at least one residence country for the party.
      type: object
      properties:
        countryCode:
          type: string
          example: GB
          description: The countries where the party lives/spends a significant time.
          x-referencetype: b-countryCodes
          x-link: GET  /party/reference/referenceTypes/{referenceTypeId}
          maxLength: 2
        countrySubDivision:
          type: string
          description: Must be a valid countrySubdivision in the Country table associated
            with the country code identified in the Residences>countryCode. If no
            countrySubdivision is defined for the country then no error will be raised.
          x-link: GET /reference/countryCode/{countryCode}/countrySubDivisions
          example: London
          maxLength: 35
        residenceStatus:
          type: string
          example: Citizen
          description: Denotes the current residence status in the country; Citizen,
            Resident, Non-Resident.
          x-referencetype: residenceStatus
          x-link: GET  /reference/referenceTypes/{referenceTypeId}
        comments:
          type: string
          example: comments if any
          description: The comments related to the residence status in the country.
          maxLength: 250
        primary:
          type: boolean
          example: true
          description: Denotes the primary country where the individual has right
            to live or permanent residency. Only one residence  can be set as primary.
            Mandatory to mark one of the residence country as primary.
        extensionData:
          type: object
          example:
            customField: value
          description: Specifies the additional attributes, which can be used to extend
            the residence details by the regional or local implementations.
          additionalProperties: true
      allOf:
      - $ref: '#/components/schemas/UniqueIds'
