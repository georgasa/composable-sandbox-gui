          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse404'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse422'
        '500':
          description: Internal Server Error
          content:
