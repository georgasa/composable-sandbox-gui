            the email address details by the regional or local implementations. These
            details are maintained at each email address level.
          additionalProperties: true
        


    CloseRoleRequestBody:
      type: object
      required:
        - exitType
        - role
      properties:
        role:
          type: string
          description: The Roles of the party in relation with the financial entity. Currently only the customer role is supported.
          example: Customer
          enum:
          - Customer
        exitType:
          type: string
          description: Identifies the type of closure for a party role ; controlled by the configuration for the party exit types reference data The retention period for the closed party depends on the exit type.
          x-referencetype: b-exitTypes
          x-link: GET  /party/reference/referenceTypes/{referenceTypeId}
          example: Closed
          maxLength: 35
        exitReason:
          type: string
          description: Identifies the underlying closure reason; controlled by the configuration for the party exit types reference data Optional when exit type captured; otherwise not allowed
          example: CustomerRequest
          maxLength: 35
        exitRemarks:
          type: string
          description: Additional details about the decision to stop the relationship with the party Optional when exit type captured; otherwise not allowed
          example: Requested by customer on call
          maxLength: 140
    CloseRoleRequest:
      type: object
      properties:
        partyRoles:
          type: array
          items:
             $ref: '#/components/schemas/CloseRoleRequestBody'
      required:
      - partyRoles

    CancelRoleClosureRequest:
      type: object
      properties:
        partyRoles:
          type: array
          items:
             $ref: '#/components/schemas/CancelRoleClosureRequestBody'
      required:
      - partyRoles

    CancelRoleClosureRequestBody:
      type: object
      properties:
        role:
          type: string
          example: 'Customer'
          description: The Roles of the party in relation with the financial entity. Currently only the customer role is supported.
          enum:
          - Customer
        remark:
          type: string
          example: 'Customer returned'
          description: Additional details about the decision to stop the relationship with the party Optional when exit type captured; otherwise not allowed
      required:
        - role
    MergePartyRequest:
      type: object
      properties:
        mergedWith:
          type: string
          example: 'GB0010001-100200'
          x-altkey: true
          description: It identifies the survivor party
          maxLength: 150
      required:
        - mergedWith
    PartyMergeHistory:
      type: object
      properties:
        uniqueId:
          type: string
          example: 1234
        mergedParty:
          type: string
          example: 100100
          description: The id of the duplicate party which was merged with the survivor party Stored as business key
          maxLength: 150
        mergedDate:
          type: string
          format: date
          example: '2023-02-10'
          description: Identifies the date when the duplicate party has been merged with the survivor party
        mergedWith:
          type: string
          example: 100200
          description: Identifies the survivor party. The survivor party might be the same as the party itself,  a duplicate party which was directly merged with the party or another party which inherited from a merged party.
          maxLength: 150
        inheritedFrom:
          type: string
          example: 100300
          description: The party from whom the merged party  is inherited It can be blank if the merged party is a duplicate, merged directly with the survivor party
          maxLength: 150
    MergePartyResponse:
      type: object
      properties:
        mergersHistory:
          type: array
          items:
           $ref: '#/components/schemas/PartyMergeHistory'

    ActivityTracker:
      type: object
