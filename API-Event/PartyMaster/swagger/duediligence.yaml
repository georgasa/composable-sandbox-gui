openapi: 3.0.0
info:
  title: Party Management APIs - Due Diligence - Applicable for Individuals and Organisations
  description: Temenos Party Microservice provides a party register for financial entities and encompasses an extensive set of RESTful APIs that streamline the administration of the party data.Structured into four distinct Open API Specification documents, this specification comprehensively covers a range of endpoints specific to the Due Diligence of the Parties.
  contact:
    url: https://basecamp.temenos.com/s/topic/0TO2K0000005Pz4WAE/microservices
  version: 1.0.0
servers:
- description: Example of valid server URL
  url: http://localhost:8000/ms-partyv2-api/api/v1.0.0
externalDocs:
  url: https://docs.temenos.com/docs/Solutions/Infinity/Microservices/Modules/Microservices/Party/Misc/Party.html
  description: Find more information here
tags:
- name: Due Diligence
  description: A set of API to create, maintain and retrieve the correspondence Due Diligence
    of a party
paths:
  /reference/dueDiligence/questionDefinitions/{questionReference}:
    post:
      summary: Captures a due diligence question definition, including the answer type, allowed options and maximum number of options that can be given, if applicable to the answer type
      tags:
       - Reference
      operationId: createDueDiligenceQuestions
      parameters:
        - name: questionReference
          in: path
          description: The question reference
          required: true
          schema:
            type: string
            minLength: 1
            example: ExtractiveIndustryActivities           
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDueDiligenceQuestionsRequest'
      responses:
        '200':
          description: Due Diligence Question created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardCreateSuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse404"
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse422"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse500"

    put:
