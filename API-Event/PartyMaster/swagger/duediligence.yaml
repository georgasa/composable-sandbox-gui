              schema:
                $ref: '#/components/schemas/ErrorResponse500'
    delete:
      summary: Deletes the questionnaire's answers for a given party and a given questionnaire reference
      operationId: deleteQuestionnaire
      tags:
      - Due Diligence
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party. It can be automatically allocated
          by the system or imposed by an external system through ingestion. Must be
          unique within the microservice.
        required: true
        x-altkey: true
        schema:
          type: string
          minLength: 1
          example: 100100
      - name: questionnaireReference
        in: path
        description: questionnaire reference.
        required: true
        schema:
          type: string
          minLength: 1
          example: IndividualOnboardingForm
      responses:
        '200':
          description: DueDiligence Questionnaire deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDeleteSuccessResponse'   
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse404"
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse422"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse500"
    get:
      summary: Retrieves the answers given by the party for a given questionnaire 
      operationId: getQuestionsAndAnswers
      tags:
       - Due Diligence
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party. It can be automatically allocated
