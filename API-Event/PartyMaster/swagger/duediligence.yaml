      tags:
       - Reference
      operationId: updateDueDiligenceQuestions
      parameters:
        - name: questionReference
          in: path
          description: The question reference
          required: true
          schema:
            type: string
            minLength: 1
            example: ExtractiveIndustryActivities               
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDueDiligenceQuestionsRequest'
      responses:
