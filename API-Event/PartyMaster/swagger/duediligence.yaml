  /party/{partyId}/dueDiligence/questionnairesAnswers/{questionnaireReference}:
    put:
      summary: Updates the answers for the supplied party and supplied questionnaire reference
      operationId: updateQuestionnaire
      tags:
      - Due Diligence
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party. It can be automatically allocated
          by the system or imposed by an external system through ingestion. Must be
          unique within the microservice.
        required: true
        x-altkey: true
        schema:
          type: string
          minLength: 1
          example: 100100
      - name: questionnaireReference
        in: path
        description: questionnaire reference.
        required: true
        schema:
          type: string
          minLength: 1
          example: IndividualOnboardingForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturedueDiligenceRequestForUpdates'
      responses:
        '200':
          description: party names updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardUpdateSuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400'
        '401':
