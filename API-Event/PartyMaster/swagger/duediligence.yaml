            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse500"
    delete:
      summary: Deletes the details of a due diligence question
      operationId: deleteDueDiligenceQuestions
      tags:
       - Reference
      parameters:
       - name: questionReference
         in: path
         description: The question reference
         required: true
