          type: string
          example: "1"
          description: The answer given by the party
          maxLength: 500
        numericValue:
          type: number
          format: decimal
          description: The Decimal answer given by the party
          example: 100.34
        booleanValue:
          type: boolean
          description: The boolean answer given by the party  
          example: "true"
        countryValues:
           type: array
           description: The answer given by the party
           maxLength: 2
           items:
            type: string
           example: 
           - "IN"
           - "US"
        currencyValues:
           type: array
           description: The answer given by the party
           maxLength: 3
           items:
            type: string
           example: 
           - "INR"
           - "USD"
        dateValue:
          type: string
          format: date
          example: '2022-02-28'
          description: The answer given by the party
