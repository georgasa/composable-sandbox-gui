  /party/{partyId}/dueDiligence:
    post:
      summary: Captures the due diligence details for party and the questions and answers given to one or multiple questionnaires
      operationId: capturedueDiligence
      tags:
      - Due Diligence
      parameters:
      - name: partyId
        in: path
        description: The unique identifier of the party. It can be automatically allocated
          by the system or imposed by an external system through ingestion. Must be
          unique within the microservice.
        required: true
        x-altkey: true
        schema:
          type: string
          minLength: 1
          example: 100100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturedueDiligenceRequest'
      responses:
        '200':
          description: party names updated successfully
          content:
            application/json:
              schema:
