components:
  schemas:
    QuestionsAndAnswersList:
      type: object
      properties:
        generalInfo:
          $ref: '#/components/schemas/GeneralInfo'
        questionnaire:
          $ref: '#/components/schemas/QuestionnairesForGet'
    DueDiligenceQuestionsUpdate:
      type: object
      properties:
        description:
           type: string
           example: Extractive Industry Activities description 
           description: Question for ExtractiveIndustryActivities
           maxLength: 500
        allowedAnswerType:
           type: string
           example: Options
           maxLength: 50
           description: Identifies the type of the answer which can be given to the question<br>Allowed values<br>->Options – a list of one or multiple values which can be answered for the particular question<br>->FreeText – a text that can be supplied to the question<br>->Numeric – indicates the answer to the question is an Numeric(ex, Amount, No od records ., )<br>->Boolean- indicates the answer to the question is true and false <br>->Date- indicates the answer to the question is a date<br>->Currencies – specifies the answer is a currency or a list of currencies<br>->Countries - specifies the answer is a country or a list of countries
           enum:
           - Options
           - FreeText
           - Numeric
           - Boolean
           - Date
           - Currencies
           - Countries
        allowedAnswerOptions:
           type: array
           description: Identifies the list of allowed options for the answer given to the question.Mandatory if the answerType is Options
           items:
             $ref: '#/components/schemas/AllowedAnswerOptionsDetails'
        maxAllowedOptions:
           type: integer
           example: 2           
           description: Identifies the maximum number of answer options which can be given for the question.Allowed only for the questions which have answerType as Options, Currencies, Countries
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the   questionnaires details by the Client or local implementations
          additionalProperties: true
    DueDiligenceQuestionsCreate:
      type: object
      properties:
        description:
           type: string
           example: Extractive Industry Activities description 
           description: Question for ExtractiveIndustryActivities
           maxLength: 500
        allowedAnswerType:
           type: string
           example: Options
           maxLength: 50
           description: Identifies the type of the answer which can be given to the question<br>Allowed values<br>->Options – a list of one or multiple values which can be answered for the particular question<br>->FreeText – a text that can be supplied to the question<br>->Numeric – indicates the answer to the question is an Numeric(ex, Amount, No od records ., )<br>->Boolean- indicates the answer to the question is true or false <br>->Date- indicates the answer to the question is a date<br>->Currencies – specifies the answer is a currency or a list of currencies<br>->Countries - specifies the answer is a country or a list of countries
           enum:
           - Options
           - FreeText
           - Numeric
           - Boolean
           - Date
           - Currencies
           - Countries
        allowedAnswerOptions:
           type: array
           description: Identifies the list of allowed options for the answer given to the question.Mandatory if the answerType is Options
           items:
             $ref: '#/components/schemas/AllowedAnswerOptionsDetails'
        maxAllowedOptions:
           type: integer
           example: 2           
           description: Identifies the maximum number of answer options which can be given for the question.Allowed only for the questions which have answerType as Options, Currencies, Countries
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the   questionnaires details by the Client or local implementations
          additionalProperties: true
      required:
        - allowedAnswerType
    DueDiligenceQuestions:
      type: object
      properties:
        questionReference:
          type: string
          example: ExtractiveIndustryActivities
          maxLength: 50
        description:
           type: string
           example: Extractive Industry Activities description 
           description: Question for ExtractiveIndustryActivities
           maxLength: 500
        allowedAnswerType:
           type: string
           example: Options
           maxLength: 50
           description: Identifies the type of the answer which can be given to the question<br>Allowed values<br>->Options – a list of one or multiple values which can be answered for the particular question<br>->FreeText – a text that can be supplied to the question<br>->Numeric – indicates the answer to the question is an Numeric(ex, Amount, No od records ., )<br>->Boolean- indicates the answer to the question is true and false <br>->Date- indicates the answer to the question is a date<br>->Currencies – specifies the answer is a currency or a list of currencies<br>->Countries - specifies the answer is a country or a list of countries
           enum:
           - Options
           - FreeText
           - Numeric
           - Boolean
           - Date
           - Currencies
           - Countries  
        allowedAnswerOptions:
           type: array
           description: Identifies the list of allowed options for the answer given to the question.Mandatory if the answerType is Options
           items:
             $ref: '#/components/schemas/AllowedAnswerOptionsDetailsGet'
        maxAllowedOptions:
           type: integer
           example: 2           
           description: Identifies the maximum number of answer options which can be given for the question.Allowed only for the questions which have answerType as Options, Currencies, Countries
        extensionData:
          type: object
          example: {"customField": "value"}  
          description: Specifies the additional attributes, which can be used to extend the   questionnaires details by the Client or local implementations
          additionalProperties: true
      required:
        - allowedAnswerType
    AllowedAnswerOptionsDetails:
      properties:
        code:
          type: string
          example: 1
          minLength: 1
          maxLength: 50
        description:
          type: string
          example: Extractive Industry Activities 1
          maxLength: 500
      required:
        - code
    AllowedAnswerOptionsDetailsGet:
      properties:
        uniqueId:
          type: string
          example: AAO250104WLOH
          description: The unique id automatically allocated by the system to each item in the allowedAnswerOptions collection
          maxLength: 15
        code:
          type: string
          example: 1
          minLength: 1
          maxLength: 50
        description:
          type: string
          example: Extractive Industry Activities 1
          maxLength: 500
      required:
        - code
    CreateDueDiligenceQuestionsRequest:
      properties:
        dueDiligenceQuestion:
          $ref: '#/components/schemas/DueDiligenceQuestionsCreate'
      required:
        - dueDiligenceQuestion
    UpdateDueDiligenceQuestionsRequest:
      properties:
        dueDiligenceQuestion:
          $ref: '#/components/schemas/DueDiligenceQuestionsUpdate'
      required:
        - dueDiligenceQuestion
    DueDiligenceQuestionsResponse:
      properties:
        dueDiligenceQuestion:
          $ref: '#/components/schemas/DueDiligenceQuestions'  
    DueDiligenceQuestionsAllItems:
      type: array
      items:
        $ref: '#/components/schemas/DueDiligenceQuestions'
    DueDiligenceQuestionsAllList:  
      type: object
      properties:              
        dueDiligenceQuestions:
          $ref: '#/components/schemas/DueDiligenceQuestionsAllItems'
    ListOfQuestionnaires:
      type: object
      properties:
        generalInfo:
          $ref: '#/components/schemas/GeneralInfo'
        questionnaires:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnairesWithOutAnswers'        
      required:
        - generalInfo
    QuestionnairesWithOutAnswers:
      type: object
      description: Questionnaires for the party.
      properties:
        uniqueId:
          type: string
          example: QA250104WLOH
          description: The unique id automatically allocated by the system to each item in the questionnaires collection
          maxLength: 15
        questionnaireReference:
          type: string
          example: IndividualOnboardingForm
