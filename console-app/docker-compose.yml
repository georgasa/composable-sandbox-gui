# Run from console-app/: docker compose up -d --build
# Build contexts are the repo root ("..") because backend/Dockerfile needs
# to COPY the sibling API-Event/ folder in.
services:
  backend:
    build:
      context: ..
      dockerfile: console-app/backend/Dockerfile
    ports:
      - "8000:8000" # direct access for debugging; frontend talks to it over the compose network
    environment:
      DEPOSITS_BASE_URL: "http://deposits-aekxuia0951.westeurope.cloudapp.azure.com/irf-deposits-container/api/v1.0.0"
      HOLDINGS_BASE_URL: "http://aekxuia0951.westeurope.cloudapp.azure.com/ms-holdings-api/api/v1.0.0"
      PARTY_BASE_URL: "http://aekxuia0951.westeurope.cloudapp.azure.com/ms-party-api/api/v5.0.0"
      LENDING_BASE_URL: "http://lending-aekxuia0951.westeurope.cloudapp.azure.com/irf-lending-container/api/v1.0.0"
      COMPANY_ID: "GB0010001"
      SYSTEM_DATE: "2025-03-14"
      # "none" locally (default -- no login screen), "password" on Azure --
      # see backend/app/auth.py. DEMO_PASSWORD only matters in "password" mode.
      AUTH_MODE: "${AUTH_MODE:-none}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
      # AI assistant defaults to OpenAI now (a local 1.5B model's accuracy
      # wasn't good enough for reliable use). No key is baked in here --
      # paste one into Environment -> AI Assistant in the running app, or
      # optionally pre-seed it via a local .env file (see .env.example,
      # never committed); ${VAR:-default} means this is a no-op without one.
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      REQUEST_TIMEOUT_SECONDS: "30"
      LONG_REQUEST_TIMEOUT_SECONDS: "90"
      PENDING_EXECUTION_TTL_SECONDS: "300"
    volumes:
      # Where the live-editable LLM provider/key/model (Environment -> AI
      # Assistant) persists -- outside the built image, .gitignore'd, but
      # durable across container recreation. Without this the key was
      # getting wiped by every backend rebuild, including ones triggered
      # by seemingly-unrelated frontend-only `docker compose up --build`.
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: console-app/frontend/Dockerfile
    ports:
      - "8091:80"
    depends_on:
      - backend
